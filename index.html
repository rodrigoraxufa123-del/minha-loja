<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>O Fofômetro Secreto 🤫</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #f43f5e;
            --accent: #8b5cf6;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 20%, #4c1d95 0%, var(--bg-color) 70%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h1 {
            font-size: 1.8rem;
            color: #fb7185;
            margin-bottom: 10px;
        }

        p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.4);
            color: white;
            font-size: 1.05rem;
            margin-bottom: 20px;
            text-align: center;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(244, 63, 94, 0.3);
        }

        .action-btn {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            border: none;
            padding: 14px 25px;
            font-size: 1.05rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.1s, opacity 0.2s;
            box-shadow: 0 10px 20px rgba(244, 63, 94, 0.3);
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        .result-box {
            background: rgba(0, 0, 0, 0.3);
            border: 1px dashed rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 16px;
            margin-top: 20px;
            font-size: 1.1rem;
            color: #fbcfe8;
            line-height: 1.5;
        }

        .whatsapp-btn {
            background-color: #25d366;
            margin-top: 15px;
            box-shadow: 0 10px 20px rgba(37, 211, 102, 0.3);
        }

        .hidden {
            display: none;
        }

        footer {
            margin-top: 30px;
            color: var(--text-muted);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="screen-home">
            <h1>🤫 O Fofômetro Secreto</h1>
            <p>Descobre o que o universo (ou os vizinhos) dizem sobre ti ou sobre um amigo!</p>
            
            <input type="text" id="username" placeholder="Escreve um nome aqui...">
            <button class="action-btn" onclick="gerarFofoca()">Revelar Segredo 🔥</button>
        </div>

        <div id="screen-result" class="hidden">
            <h1>Resultado Oficial 🕵️‍♂️</h1>
            <div class="result-box" id="fofoca-text">Carregando segredo...</div>
            
            <button class="action-btn whatsapp-btn" onclick="partilharWhatsApp()">Partilhar no WhatsApp 💬</button>
            <button class="action-btn" style="background: rgba(255,255,255,0.1); margin-top: 10px;" onclick="voltarInicio()">Testar Outro Nome 🔄</button>
        </div>
    </div>

    <footer>
        Dani Viral Apps • Hospedado no GitHub Pages
    </footer>

    <script>
        const fofocas = [
            "já tentou abrir a porta de puxar empurrando e fingiu que ninguém viu.",
            "passa mais de 3 horas por dia a olhar para o teto a pensar na vida.",
            "tem um segredo guardado que nem a própria inteligência artificial consegue adivinhar!",
            "comprou coisas desnecessárias na internet esta semana.",
            "é o agente secreto do grupo e sabe de tudo o que se passa.",
            "tem um talento escondido para dançar sozinho(a) no quarto às 3 da manhã.",
            "já adormeceu a ver uma série e acordou no episódio seguinte sem entender nada."
        ];

        let ultimoResultado = "";

        function gerarFofoca() {
            const nome = document.getElementById('username').value.trim();
            
            if (!nome) {
                alert("Por favor, escreve um nome primeiro!");
                return;
            }

            // Escolhe uma fofoca aleatória da lista
            const fofocaAleatoria = fofocas[Math.floor(Math.random() * fofocas.length)];
            ultimoResultado = `⚠️ Segredo revelado sobre ${nome}: ${fofocaAleatoria}`;

            document.getElementById('fofoca-text').innerText = ultimoResultado;
            document.getElementById('screen-home').classList.add('hidden');
            document.getElementById('screen-result').classList.remove('hidden');
        }

        function partilharWhatsApp() {
            const mensagem = encodeURIComponent(`Olha o que descobri no Fofômetro Secreto! 😂\n\n${ultimoResultado}\n\nClica aqui para descobrir o teu: ` + window.location.href);
            window.open(`https://api.whatsapp.com/send?text=${mensagem}`, '_blank');
        }

        function voltarInicio() {
            document.getElementById('username').value = "";
            document.getElementById('screen-result').classList.add('hidden');
            document.getElementById('screen-home').classList.remove('hidden');
        }
    </script>
</body>
</html>
