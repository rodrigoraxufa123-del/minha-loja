<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Webblox - Jogo 3D</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB; /* Azul céu clássico */
            touch-action: none; /* Previne zoom e scroll no mobile */
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        /* Interface (HUD) */
        .hud {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            text-shadow: 1px 1px 2px black;
            pointer-events: none;
        }

        /* Controles Mobile */
        .controls {
            position: absolute;
            bottom: 30px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            user-select: none;
        }

        .d-pad {
            display: grid;
            grid-template-columns: 60px 60px 60px;
            grid-template-rows: 60px 60px;
            gap: 5px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            font-size: 24px;
            cursor: pointer;
            backdrop-filter: blur(4px);
        }

        .btn:active {
            background: rgba(255, 255, 255, 0.6);
        }

        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }

        .action-pad {
            display: flex;
            align-items: flex-end;
        }

        #btn-jump {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            font-size: 16px;
        }
    </style>
    <!-- Importando o Motor 3D (Three.js) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div class="hud">
        <h2>Webblox</h2>
        <p>Use o D-Pad para andar e o círculo para pular.</p>
    </div>

    <div id="game-container"></div>

    <!-- Controles na Tela -->
    <div class="controls">
        <div class="d-pad">
            <div class="btn" id="btn-up">W</div>
            <div class="btn" id="btn-left">A</div>
            <div class="btn" id="btn-down">S</div>
            <div class="btn" id="btn-right">D</div>
        </div>
        <div class="action-pad">
            <div class="btn" id="btn-jump">PULO</div>
        </div>
    </div>

    <script>
        // 1. Configuração Básica do Mundo 3D
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Cor do céu
        scene.fog = new THREE.Fog(0x87CEEB, 10, 50);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.getElementById('game-container').appendChild(renderer.domElement);

        // 2. Iluminação
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // 3. Criando o Chão (Baseplate Clássico)
        const groundGeo = new THREE.PlaneGeometry(100, 100);
        const groundMat = new THREE.MeshLambertMaterial({ color: 0x4CAF50 }); // Verde escuro
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Grid (Linhas do chão para dar aparência de blocos)
        const gridHelper = new THREE.GridHelper(100, 50, 0x000000, 0x000000);
        gridHelper.material.opacity = 0.2;
        gridHelper.material.transparent = true;
        scene.add(gridHelper);

        // 4. Criando o Jogador (Bloco estilo Noob)
        const playerGeo = new THREE.BoxGeometry(1, 1, 1);
        const playerMat = new THREE.MeshLambertMaterial({ color: 0xFFD700 }); // Amarelo
        const player = new THREE.Mesh(playerGeo, playerMat);
        player.position.y = 0.5;
        player.castShadow = true;
        scene.add(player);

        // 5. Adicionando obstáculos (Mini Parkour)
        const boxMat = new THREE.MeshLambertMaterial({ color: 0xFF5722 });
        const plataformas = [
            { x: 0, y: 0.5, z: -5, w: 2, h: 1, d: 2 },
            { x: 0, y: 1.5, z: -9, w: 2, h: 1, d: 2 },
            { x: 3, y: 2.5, z: -12, w: 2, h: 1, d: 2 }
        ];

        plataformas.forEach(p => {
            const block = new THREE.Mesh(new THREE.BoxGeometry(p.w, p.h, p.d), boxMat);
            block.position.set(p.x, p.y, p.z);
            block.castShadow = true;
            block.receiveShadow = true;
            scene.add(block);
        });

        // 6. Controles e Física
        const input = { up: false, down: false, left: false, right: false, jump: false };
        let velocityY = 0;
        let isGrounded = true;
        const speed = 0.1;
        const jumpForce = 0.25;
        const gravity = -0.015;

        // Função para mapear botões da tela
        function bindButton(id, key) {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); input[key] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); input[key] = false; });
            btn.addEventListener('mousedown', () => input[key] = true);
            btn.addEventListener('mouseup', () => input[key] = false);
            btn.addEventListener('mouseleave', () => input[key] = false);
        }

        bindButton('btn-up', 'up');
        bindButton('btn-down', 'down');
        bindButton('btn-left', 'left');
        bindButton('btn-right', 'right');
        bindButton('btn-jump', 'jump');

        // Suporte a Teclado (Para PC)
        document.addEventListener('keydown', (e) => {
            if(e.key === 'w' || e.key === 'W') input.up = true;
            if(e.key === 's' || e.key === 'S') input.down = true;
            if(e.key === 'a' || e.key === 'A') input.left = true;
            if(e.key === 'd' || e.key === 'D') input.right = true;
            if(e.key === ' ') input.jump = true;
        });
        document.addEventListener('keyup', (e) => {
            if(e.key === 'w' || e.key === 'W') input.up = false;
            if(e.key === 's' || e.key === 'S') input.down = false;
            if(e.key === 'a' || e.key === 'A') input.left = false;
            if(e.key === 'd' || e.key === 'D') input.right = false;
            if(e.key === ' ') input.jump = false;
        });

        // 7. Loop Principal do Jogo (O que acontece a cada frame)
        function animate() {
            requestAnimationFrame(animate);

            // Movimentação do Jogador
            if (input.up) player.position.z -= speed;
            if (input.down) player.position.z += speed;
            if (input.left) player.position.x -= speed;
            if (input.right) player.position.x += speed;

            // Sistema de Pulo e Gravidade
            if (input.jump && isGrounded) {
                velocityY = jumpForce;
                isGrounded = false;
            }

            player.position.y += velocityY;
            velocityY += gravity;

            // Colisão com o chão
            if (player.position.y <= 0.5) {
                player.position.y = 0.5;
                velocityY = 0;
                isGrounded = true;
            }

            // A Câmera segue o jogador (Terceira pessoa)
            camera.position.x = player.position.x;
            camera.position.y = player.position.y + 3; // Câmera acima do jogador
            camera.position.z = player.position.z + 6; // Câmera atrás do jogador
            camera.lookAt(player.position);

            renderer.render(scene, camera);
        }

        // Responsividade (Ajusta a tela ao girar o celular)
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate(); // Inicia o jogo
    </script>
</body>
</html>
