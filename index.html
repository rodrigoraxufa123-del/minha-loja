<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Achadinhos Feed 🛍️ Shopee & ML</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #fff;
            overflow: hidden;
        }

        /* Feed estilo TikTok / Reels */
        .feed-container {
            width: 100%;
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
        }

        .reel-card {
            width: 100%;
            height: 100vh;
            scroll-snap-align: start;
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            background: #111;
        }

        /* Vídeo de Fundo */
        .reel-card video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* Sombra gradiente para destacar o texto */
        .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60%;
            background: linear-gradient(to top, rgba(0,0,0,0.9), rgba(0,0,0,0.4), transparent);
            z-index: 2;
            padding: 25px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .product-tag {
            background: #ff5722;
            color: white;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: bold;
            width: fit-content;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .product-title {
            font-size: 1.15rem;
            font-weight: bold;
            margin-bottom: 5px;
            line-height: 1.3;
        }

        .product-price {
            font-size: 1.3rem;
            color: #4ade80;
            font-weight: bold;
            margin-bottom: 15px;
        }

        /* Botão de Compra Afiliado */
        .buy-btn {
            background: linear-gradient(135deg, #ff5722, #ff784e);
            color: white;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 14px;
            cursor: pointer;
            width: 100%;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 10px 20px rgba(255, 87, 34, 0.4);
            display: block;
            transition: transform 0.1s;
        }

        .buy-btn:active {
            transform: scale(0.98);
        }

        /* Indicador de deslizar para cima */
        .swipe-hint {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            z-index: 3;
            color: #cbd5e1;
        }
    </style>
</head>
<body>

    <div class="feed-container" id="feed">
        <!-- Os vídeos e produtos são gerados dinamicamente via JavaScript -->
    </div>

    <script>
        // Lista de produtos com vídeos curtos de demonstração e links de afiliado
        const achadinhos = [
            {
                titulo: "Mini Lanterna de Chaveiro Ultra Potente 3 em 1",
                preco: "R$ 19,90",
                loja: "Shopee",
                video: "https://assets.mixkit.co/videos/preview/mixkit-woman-holding-a-neon-light-42994-large.mp4",
                link: "https://shopee.com.br" // Substitua pelo seu link de afiliado real
            },
            {
                titulo: "Suporte Magnético para Celular Giratório 360º",
                preco: "R$ 34,90",
                loja: "Mercado Livre",
                video: "https://assets.mixkit.co/videos/preview/mixkit-hands-holding-a-smartphone-with-a-green-screen-42998-large.mp4",
                link: "https://mercadolivre.com.br" // Substitua pelo seu link de afiliado real
            },
            {
                titulo: "Luminária de Mesa LED Touch Minimalista RGB",
                preco: "R$ 49,90",
                loja: "Shopee",
                video: "https://assets.mixkit.co/videos/preview/mixkit-neon-lights-in-a-room-41554-large.mp4",
                link: "https://shopee.com.br" // Substitua pelo seu link de afiliado real
            }
        ];

        const feedEl = document.getElementById('feed');

        function carregarFeed() {
            achadinhosforEach = achadinhos.forEach((item, index) => {
                const reel = document.createElement('div');
                reel.className = 'reel-card';
                
                reel.innerHTML = `
                    <div class="swipe-hint">Deslize ↕ (${index + 1}/${achadinhos.length})</div>
                    <video src="${item.video}" autoplay loop muted playsinline></video>
                    <div class="overlay">
                        <span class="product-tag">🔥 Achadinho da ${item.loja}</span>
                        <div class="product-title">${item.titulo}</div>
                        <div class="product-price">${item.preco}</div>
                        <a href="${item.link}" target="_blank" class="buy-btn">Ver na ${item.loja} 🛒</a>
                    </div>
                `;
                feedEl.appendChild(reel);
            });
        }

        carregarFeed();
    </script>
</body>
</html>
