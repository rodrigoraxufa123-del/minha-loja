<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Snake - Advanced</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: manipulation; /* Evita zoom duplo no celular */
        }

        body {
            background-color: #0b0f19;
            background-image: radial-gradient(circle at 50% 50%, #1a1525 0%, #0b0f19 80%);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2.2rem;
            color: #06b6d4;
            text-shadow: 0 0 10px #06b6d4;
            letter-spacing: 2px;
        }

        .score-board {
            font-size: 1.5rem;
            color: #a855f7;
            font-weight: bold;
            margin-top: 5px;
            text-shadow: 0 0 10px #a855f7;
        }

        /* O Canvas onde o jogo é renderizado */
        canvas {
            background-color: #0f172a;
            border: 2px solid #334155;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(6, 182, 212, 0.2);
            display: block;
        }

        /* Controles Virtuais para Celular */
        .controls {
            margin-top: 30px;
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(2, 60px);
            gap: 10px;
            justify-content: center;
        }

        .btn {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px;
            color: white;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: background 0.1s;
        }

        .btn:active {
            background: #06b6d4;
            box-shadow: 0 0 15px #06b6d4;
            transform: scale(0.95);
        }

        .up { grid-column: 2; grid-row: 1; }
        .left { grid-column: 1; grid-row: 2; }
        .down { grid-column: 2; grid-row: 2; }
        .right { grid-column: 3; grid-row: 2; }

    </style>
</head>
<body>

    <header>
        <h1>CYBER SNAKE</h1>
        <div class="score-board">Pontos: <span id="score">0</span></div>
    </header>

    <!-- Área Gráfica do Jogo -->
    <canvas id="gameCanvas" width="300" height="300"></canvas>

    <!-- Direcionais para Mobile -->
    <div class="controls">
        <div class="btn up" onclick="setDirection('UP')">⬆️</div>
        <div class="btn left" onclick="setDirection('LEFT')">⬅️</div>
        <div class="btn down" onclick="setDirection('DOWN')">⬇️</div>
        <div class="btn right" onclick="setDirection('RIGHT')">➡️</div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Configurações da grade
        const box = 15; // Tamanho de cada quadrado
        const canvasSize = 300;
        const totalBoxes = canvasSize / box;

        let snake = [];
        snake[0] = { x: 10 * box, y: 10 * box }; // Posição inicial

        let food = {
            x: Math.floor(Math.random() * totalBoxes) * box,
            y: Math.floor(Math.random() * totalBoxes) * box
        };

        let score = 0;
        let d = "RIGHT"; // Direção inicial
        let gameLoop;
        let velocidade = 120;

        // Função para receber controles da tela (Touch)
        function setDirection(newDir) {
            if (newDir === "LEFT" && d !== "RIGHT") d = "LEFT";
            else if (newDir === "UP" && d !== "DOWN") d = "UP";
            else if (newDir === "RIGHT" && d !== "LEFT") d = "RIGHT";
            else if (newDir === "DOWN" && d !== "UP") d = "DOWN";
        }

        // Função para receber controles do teclado (Computador)
        document.addEventListener("keydown", (event) => {
            let key = event.keyCode;
            if (key == 37 && d !== "RIGHT") d = "LEFT";
            else if (key == 38 && d !== "DOWN") d = "UP";
            else if (key == 39 && d !== "LEFT") d = "RIGHT";
            else if (key == 40 && d !== "UP") d = "DOWN";
        });

        // Detecta colisão com o próprio corpo
        function collision(head, array) {
            for (let i = 0; i < array.length; i++) {
                if (head.x === array[i].x && head.y === array[i].y) {
                    return true;
                }
            }
            return false;
        }

        // Motor de Renderização e Lógica (Atualiza a cada frame)
        function draw() {
            // Limpa o canvas
            ctx.fillStyle = "#0f172a";
            ctx.fillRect(0, 0, canvasSize, canvasSize);

            // Desenha a cobra
            for (let i = 0; i < snake.length; i++) {
                ctx.fillStyle = (i === 0) ? "#06b6d4" : "#3b82f6"; // Cabeça ciano, corpo azul
                ctx.shadowBlur = 10;
                ctx.shadowColor = (i === 0) ? "#06b6d4" : "transparent"; // Brilho só na cabeça
                ctx.fillRect(snake[i].x, snake[i].y, box - 1, box - 1);
            }

            // Desenha a comida
            ctx.fillStyle = "#ec4899"; // Rosa Neon
            ctx.shadowBlur = 15;
            ctx.shadowColor = "#ec4899";
            ctx.fillRect(food.x, food.y, box - 1, box - 1);
            
            // Reseta o brilho para não bugar o resto
            ctx.shadowBlur = 0; 

            // Posição atual da cabeça
            let snakeX = snake[0].x;
            let snakeY = snake[0].y;

            // Movimentação
            if (d === "LEFT") snakeX -= box;
            if (d === "UP") snakeY -= box;
            if (d === "RIGHT") snakeX += box;
            if (d === "DOWN") snakeY += box;

            // Se comer a comida
            if (snakeX === food.x && snakeY === food.y) {
                score += 10;
                document.getElementById("score").innerText = score;
                
                // Gera nova comida
                food = {
                    x: Math.floor(Math.random() * totalBoxes) * box,
                    y: Math.floor(Math.random() * totalBoxes) * box
                };
            } else {
                // Remove o último pedaço da cauda se não comeu
                snake.pop(); 
            }

            let newHead = { x: snakeX, y: snakeY };

            // Regras de Game Over (Bater na parede ou no corpo)
            if (snakeX < 0 || snakeX >= canvasSize || snakeY < 0 || snakeY >= canvasSize || collision(newHead, snake)) {
                clearInterval(gameLoop);
                alert("GAME OVER! Sua pontuação: " + score);
                location.reload(); // Reinicia o jogo
            }

            // Adiciona a nova cabeça
            snake.unshift(newHead);
        }

        // Inicia o loop do jogo
        gameLoop = setInterval(draw, velocidade);
    </script>
</body>
</html>
