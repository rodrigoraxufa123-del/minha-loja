<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dani Games - Premium</title>
    <style>
        :root {
            --bg-color: #050b14;
            --card-bg: #111827;
            --primary: #f59e0b;
            --text: #f8fafc;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            min-height: 100vh;
        }

        /* --- TELA DO PORTAL --- */
        #portal-screen {
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
        }

        header { text-align: center; margin-bottom: 40px; padding-top: 20px; }
        header h1 { font-size: 2.8rem; color: var(--primary); text-transform: uppercase; letter-spacing: 2px;}
        header p { color: #94a3b8; font-size: 1.1rem; margin-top: 5px;}

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .game-card {
            background-color: var(--card-bg);
            border-radius: 15px;
            padding: 0;
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            border: 1px solid rgba(255,255,255,0.05);
            overflow: hidden;
        }

        .game-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 25px rgba(245, 158, 11, 0.3);
            border-color: var(--primary);
        }

        .game-banner {
            width: 100%;
            height: 160px;
            background-size: cover;
            background-position: center;
        }

        .banner-shooter { background-image: url('https://img.gamedistribution.com/23eb5df18cc347bb83cc0486c8f42c26-512x512.jpeg'); }
        .banner-moto { background-image: url('https://img.gamedistribution.com/214a1a6775f042ee85c138f61561f5f9-512x512.jpeg'); }

        .game-info { padding: 20px; }
        .game-title { font-size: 1.5rem; margin-bottom: 5px; color: #fff;}
        .game-desc { font-size: 0.95rem; color: #94a3b8; }

        /* --- TELA DE JOGO ATIVO (IFRAME) --- */
        #active-game-screen {
            display: none;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            background-color: #000;
        }

        .nav-bar {
            width: 100%;
            height: 60px;
            background: #111;
            display: flex;
            align-items: center;
            padding: 0 20px;
            z-index: 10;
        }

        .back-btn {
            background: #ef4444; color: white; border: none; padding: 10px 20px;
            border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem;
        }

        .iframe-container {
            flex-grow: 1;
            width: 100%;
            height: calc(100vh - 60px);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div id="portal-screen">
        <header>
            <h1>🔥 Dani Games PRO</h1>
            <p>Os melhores jogos da internet em um só lugar.</p>
        </header>

        <div class="games-grid">
            <div class="game-card" onclick="abrirJogo('https://html5.gamedistribution.com/23eb5df18cc347bb83cc0486c8f42c26/')">
                <div class="game-banner banner-shooter"></div>
                <div class="game-info">
                    <h2 class="game-title">Sniper Clash 3D</h2>
                    <p class="game-desc">Jogo de tiro multiplayer realista com personagens em 3D.</p>
                </div>
            </div>
            
            <div class="game-card" onclick="abrirJogo('https://html5.gamedistribution.com/214a1a6775f042ee85c138f61561f5f9/')">
                <div class="game-banner banner-moto"></div>
                <div class="game-info">
                    <h2 class="game-title">Moto X3M</h2>
                    <p class="game-desc">O melhor jogo de Motocross com física insana e obstáculos.</p>
                </div>
            </div>
        </div>
    </div>

    <div id="active-game-screen">
        <div class="nav-bar">
            <button class="back-btn" onclick="voltarPortal()">⬅ Voltar ao Site</button>
        </div>
        <div class="iframe-container" id="iframe-box">
            </div>
    </div>

    <script>
        function abrirJogo(urlDoJogo) {
            // Esconde o portal e mostra a tela de jogo
            document.getElementById('portal-screen').style.display = 'none';
            document.getElementById('active-game-screen').style.display = 'flex';
            
            // Injeta o iframe com o jogo escolhido
            document.getElementById('iframe-box').innerHTML = `<iframe src="${urlDoJogo}" allowfullscreen="true" scrolling="no"></iframe>`;
        }

        function voltarPortal() {
            // Esconde a tela de jogo e volta para o portal
            document.getElementById('active-game-screen').style.display = 'none';
            document.getElementById('portal-screen').style.display = 'block';
            
            // Remove o jogo para parar o som e economizar memória do celular
            document.getElementById('iframe-box').innerHTML = '';
        }
    </script>
</body>
</html>
