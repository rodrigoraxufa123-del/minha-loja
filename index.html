<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cine & Game Quiz - Descubra Seu Nível</title>
    <style>
        :root {
            --bg-color: #080c14;
            --card-bg: #111827;
            --primary: #8b5cf6;
            --accent: #06b6d4;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 20%, #1e1b4b 0%, var(--bg-color) 70%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 1.8rem;
            background: linear-gradient(to right, var(--accent), var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        /* Área do Quiz */
        #quiz-box {
            display: block;
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: #fff;
            text-align: left;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text);
            padding: 12px 15px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            text-align: left;
            transition: all 0.2s ease;
        }

        .option-btn:hover {
            background-color: var(--primary);
            border-color: var(--primary);
            transform: translateX(3px);
        }

        /* Tela de Resultado */
        #result-box {
            display: none;
        }

        .score-display {
            font-size: 2.5rem;
            color: #4ade80;
            font-weight: bold;
            margin: 15px 0;
        }

        .action-btn {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            transition: opacity 0.2s;
        }

        .action-btn:hover {
            opacity: 0.9;
        }

        footer {
            margin-top: 30px;
            color: var(--text-muted);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Tela de Perguntas -->
        <div id="quiz-box">
            <h1>🎬 Cine & Game Quiz</h1>
            <p id="counter">Pergunta 1 de 4</p>
            
            <div class="question-text" id="question">Carregando pergunta...</div>
            
            <div class="options-grid" id="options">
                <!-- As opções entram via JavaScript -->
            </div>
        </div>

        <!-- Tela de Resultado -->
        <div id="result-box">
            <h1>Fim do Quiz! 🎉</h1>
            <p>Sua pontuação final foi:</p>
            <div class="score-display" id="final-score">0/4</div>
            <p id="result-msg">Você entende muito de cultura pop!</p>
            <button class="action-btn" onclick="reiniciarQuiz()">Jogar Novamente 🔄</button>
        </div>
    </div>

    <footer>
        Dani Entretenimento • Hospedado no GitHub Pages
    </footer>

    <script>
        const perguntas = [
            {
                pergunta: "Qual é o nome do encanador mais famoso dos videogames da Nintendo?",
                opcoes: ["Sonic", "Mario", "Link", "Donkey Kong"],
                correta: 1
            },
            {
                pergunta: "Em qual trilogia de filmes aparece o personagem Darth Vader?",
                opcoes: ["Harry Potter", "Senhor dos Anéis", "Star Wars", "Matrix"],
                correta: 2
            },
            {
                pergunta: "Qual estúdio criou os filmes de animação 'Toy Story' e 'Procurando Nemo'?",
                opcoes: ["Pixar", "DreamWorks", "Disney Animation", "Illumination"],
                correta: 0
            },
            {
                pergunta: "No jogo Minecraft, qual bloco é essencial para construir um portal para o Nether?",
                opcoes: ["Diamante", "Obsidiana", "Ouro", "Pedra Redonda"],
                correta: 1
            }
        ];

        let perguntaAtual = 0;
        let pontuacao = 0;

        const questionEl = document.getElementById("question");
        const optionsEl = document.getElementById("options");
        const counterEl = document.getElementById("counter");
        const quizBox = document.getElementById("quiz-box");
        const resultBox = document.getElementById("result-box");
        const finalScoreEl = document.getElementById("final-score");
        const resultMsgEl = document.getElementById("result-msg");

        function carregarPergunta() {
            let q = perguntas[perguntaAtual];
            counterEl.innerText = `Pergunta ${perguntaAtual + 1} de ${perguntas.length}`;
            questionEl.innerText = q.pergunta;
            
            optionsEl.innerHTML = "";
            q.opcoes.forEach((opcao, index) => {
                let btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerText = opcao;
                btn.onclick = () => selecionarResposta(index);
                optionsEl.appendChild(btn);
            });
        }

        function selecionarResposta(indiceEscolhido) {
            if (indiceEscolhido === perguntas[perguntaAtual].correta) {
                pontuacao++;
            }

            perguntaAtual++;

            if (perguntaAtual < perguntas.length) {
                carregarPergunta();
            } else {
                mostrarResultado();
            }
        }

        function mostrarResultado() {
            quizBox.style.display = "none";
            resultBox.style.display = "block";
            finalScoreEl.innerText = `${pontuacao}/${perguntas.length}`;

            if (pontuacao === perguntas.length) {
                resultMsgEl.innerText = "🏆 Perfeito! Você é um verdadeiro mestre nerd!";
            } else if (pontuacao >= 2) {
                resultMsgEl.innerText = "👍 Muito bom! Você manja bastante de entretenimento.";
            } else {
                resultMsgEl.innerText = "😅 Precisa assistir a mais filmes e jogar mais!";
            }
        }

        function reiniciarQuiz() {
            perguntaAtual = 0;
            pontuacao = 0;
            resultBox.style.display = "none";
            quizBox.style.display = "block";
            carregarPergunta();
        }

        // Iniciar o jogo
        carregarPergunta();
    </script>

</body>
</html>
