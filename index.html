<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Time Machine - Viaje no Tempo ⏳</title>
    <style>
        :root {
            --bg-color: #07090e;
            --card-bg: #111827;
            --primary: #38bdf8;
            --accent: #f43f5e;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 20%, #1e1b4b 0%, var(--bg-color) 70%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: rgba(17, 24, 39, 0.9);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        h1 {
            font-size: 1.7rem;
            color: var(--primary);
            margin-bottom: 5px;
        }

        p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        /* Seleção de Idade */
        .age-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .age-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .age-btn.selected {
            background: var(--primary);
            color: #000;
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }

        /* Área da Câmara */
        .camera-box {
            width: 100%;
            aspect-ratio: 3/4;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            margin-bottom: 20px;
            border: 2px dashed rgba(255, 255, 255, 0.2);
        }

        video, canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .action-btn {
            background: linear-gradient(135deg, var(--primary), #0284c7);
            color: white;
            border: none;
            padding: 14px 25px;
            font-size: 1.05rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.1s, opacity 0.2s;
            box-shadow: 0 10px 20px rgba(56, 189, 248, 0.3);
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        .whatsapp-btn {
            background-color: #25d366;
            margin-top: 15px;
            box-shadow: 0 10px 20px rgba(37, 211, 102, 0.3);
        }

        .report-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px dashed rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 12px;
            margin: 15px 0;
            text-align: left;
            font-size: 0.9rem;
            color: #e2e8f0;
            line-height: 1.4;
        }

        .hidden {
            display: none;
        }

        footer {
            margin-top: 25px;
            color: var(--text-muted);
            font-size: 0.75rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ECRÃ 1: Configuração e Câmara -->
        <div id="screen-camera">
            <h1>⏳ Time Machine</h1>
            <p>Escolha para qual idade quer viajar:</p>

            <div class="age-selector">
                <button class="age-btn selected" onclick="escolherIdade(40, this)">40 Anos</button>
                <button class="age-btn" onclick="escolherIdade(60, this)">60 Anos</button>
                <button class="age-btn" onclick="escolherIdade(80, this)">80 Anos</button>
            </div>

            <div class="camera-box">
                <video id="webcam" autoplay playsinline></video>
                <canvas id="photoCanvas" class="hidden"></canvas>
            </div>

            <button class="action-btn" onclick="tirarFoto()">Tirar Foto & Envelhecer 📸</button>
        </div>

        <!-- ECRÃ 2: Resultado -->
        <div id="screen-result" class="hidden">
            <h1>Relatório do Futuro 🔮</h1>
            <p id="target-age-label" style="color: var(--primary); font-weight: bold;"></p>

            <div class="camera-box" style="margin-top: 15px;">
                <canvas id="resultCanvas"></canvas>
            </div>

            <div class="report-box" id="futureReport">
                A analisar linhas do tempo...
            </div>

            <button class="action-btn whatsapp-btn" onclick="partilharWhatsApp()">Partilhar no WhatsApp 💬</button>
            <button class="action-btn" style="background: rgba(255,255,255,0.1); margin-top: 10px;" onclick="reiniciarMaquina()">Viajar Novamente 🔄</button>
        </div>
    </div>

    <footer>
        Dani Time Apps • Hospedado no GitHub Pages
    </footer>

    <script>
        let idadeEscolhida = 40;
        let videoStream = null;

        const video = document.getElementById('webcam');
        const photoCanvas = document.getElementById('photoCanvas');
        const resultCanvas = document.getElementById('resultCanvas');

        // Iniciar a câmara frontal do telemóvel automaticamente
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false })
            .then(stream => {
                videoStream = stream;
                video.srcObject = stream;
            })
            .catch(err => {
                alert("Erro ao aceder à câmara. Certifique-se de permitir o acesso no navegador!");
            });

        function escolherIdade(idade, elemento) {
            idadeEscolhida = idade;
            document.querySelectorAll('.age-btn').forEach(btn => btn.classList.remove('selected'));
            elemento.classList.add('selected');
        }

        function tirarFoto() {
            const context = photoCanvas.getContext('2d');
            photoCanvas.width = video.videoWidth || 300;
            photoCanvas.height = video.videoHeight || 400;
            
            // Desenha a imagem atual da câmara no canvas oculto
            context.drawImage(video, 0, 0, photoCanvas.width, photoCanvas.height);

            // Processa o efeito visual de envelhecimento (Filtro futurista/sepia/contraste)
            processarEfeitoEnvelhecimento(photoCanvas, resultCanvas, idadeEscolhida);

            // Desliga a câmara para poupar bateria
            if(videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
            }

            // Gera relatório engraçado
            gerarRelatorio(idadeEscolhida);

            // Muda de ecrã
            document.getElementById('screen-camera').classList.add('hidden');
            document.getElementById('screen-result').classList.remove('hidden');
            document.getElementById('target-age-label').innerText = `Você aos ${idadeEscolhida} Anos de Idade`;
        }

        function processarEfeitoEnvelhecimento(origemCanvas, destinoCanvas, idade) {
            const ctxDest = destinoCanvas.getContext('2d');
            destinoCanvas.width = origemCanvas.width;
            destinoCanvas.height = origemCanvas.height;

            // Aplica filtros personalizados via Canvas baseados na idade escolhida
            ctxDest.filter = idade === 80 ? 'sepia(80%) contrast(140%) grayscale(40%) blur(0.5px)' : 
                             idade === 60 ? 'sepia(50%) contrast(120%)' : 'contrast(110%) saturate(80%)';
            
            ctxDest.drawImage(origemCanvas, 0, 0);

            // Adiciona um carimbo visual de "Time Machine" na foto
            ctxDest.filter = 'none';
            ctxDest.fillStyle = 'rgba(0, 0, 0, 0.6)';
            ctxDest.fillRect(10, destinoCanvas.height - 40, destinoCanvas.width - 20, 30);
            ctxDest.fillStyle = '#38bdf8';
            ctxDest.font = 'bold 16px sans-serif';
            ctxDest.fillText(`TIME MACHINE - ${idade} ANOS`, 20, destinoCanvas.height - 20);
        }

        function gerarRelatorio(idade) {
            let relatorio = "";
            if (idade === 40) {
                relatorio = "💼 **Status aos 40:** Estável, com um carro financiado, a pagar boletos a tempo e a reclamar de dores nas costas ao levantar da cama.";
            } else if (idade === 60) {
                relatorio = "🏖️ **Status aos 60:** Chefe da família! Especialista em dar conselhos que ninguém pede, mestre em regatear preços e dono de um sorriso sábio.";
            } else {
                relatorio = "👑 **Status aos 80:** Lenda viva! Viciado em novelas, dono de todas as histórias malucas da família e com passe livre em qualquer fila.";
            }
            document.getElementById('futureReport').innerHTML = relatorio;
        }

        function partilharWhatsApp() {
            const texto = encodeURIComponent(`Viajei no tempo com a Time Machine e descobri como vou estar aos ${idadeEscolhida} anos! 😂 Clica aqui para testar a tua foto também: ` + window.location.href);
            window.open(`https://api.whatsapp.com/send?text=${texto}`, '_blank');
        }

        function reiniciarMaquina() {
            window.location.reload();
        }
    </script>
</body>
</html>
