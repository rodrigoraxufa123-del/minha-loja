<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Achadinhos VIP 🛍️🔥</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #fff;
            overflow: hidden;
        }

        .feed-container {
            width: 100%;
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
            position: relative;
        }

        .video-card {
            width: 100%;
            height: 100vh;
            scroll-snap-align: start;
            position: relative;
            display: flex;
            justify-content: center;
            background: #111;
        }

        .video-card video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        .overlay-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: linear-gradient(to top, rgba(0,0,0,0.9), rgba(0,0,0,0.6), transparent);
            z-index: 2;
            padding: 20px 70px 30px 20px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            pointer-events: none;
        }

        .product-badge {
            background: rgba(255, 48, 64, 0.9);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 800;
            width: fit-content;
            margin-bottom: 10px;
            text-transform: uppercase;
            backdrop-filter: blur(4px);
            pointer-events: auto;
        }

        .product-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 5px;
            line-height: 1.3;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        .price-container {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 15px;
        }

        .price-old {
            font-size: 0.9rem;
            color: #94a3b8;
            text-decoration: line-through;
        }

        .price-new {
            font-size: 1.6rem;
            color: #4ade80;
            font-weight: 900;
            text-shadow: 0 0 10px rgba(74, 222, 128, 0.3);
        }

        .sidebar {
            position: absolute;
            right: 15px;
            bottom: 100px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            z-index: 5;
            align-items: center;
        }

        .action-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            color: #fff;
            cursor: pointer;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
            transition: transform 0.2s;
        }

        .action-icon:active {
            transform: scale(0.8);
        }

        .icon-circle {
            width: 45px;
            height: 45px;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(5px);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.4rem;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .icon-text {
            font-size: 0.75rem;
            font-weight: 600;
        }

        .liked .icon-circle {
            background: rgba(255, 48, 64, 0.2);
            border-color: #ff3040;
            color: #ff3040;
        }

        .buy-btn {
            background: linear-gradient(90deg, #ff3b30, #ff9500);
            color: white;
            border: none;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: 900;
            border-radius: 25px;
            cursor: pointer;
            width: 100%;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 10px 30px rgba(255, 59, 48, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            pointer-events: auto;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); box-shadow: 0 10px 40px rgba(255, 59, 48, 0.7); }
            100% { transform: scale(1); }
        }

        .floating-heart {
            position: absolute;
            font-size: 4rem;
            color: #ff3040;
            z-index: 10;
            animation: floatUp 1s ease-out forwards;
            pointer-events: none;
            text-shadow: 0 0 20px rgba(255, 48, 64, 0.5);
        }

        @keyframes floatUp {
            0% { transform: scale(0) translateY(0); opacity: 1; }
            50% { transform: scale(1.2) translateY(-50px); opacity: 1; }
            100% { transform: scale(1) translateY(-150px); opacity: 0; }
        }

        .modal-gamification {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            z-index: 50;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .modal-gamification.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            padding: 30px 20px;
            border-radius: 24px;
            text-align: center;
            width: 85%;
            max-width: 350px;
            border: 2px solid #ff9500;
            box-shadow: 0 0 40px rgba(255, 149, 0, 0.4);
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-gamification.active .modal-content {
            transform: scale(1);
        }

        .modal-content h2 {
            color: #ff9500;
            margin-bottom: 10px;
        }
        
        .modal-btn {
            background: #4ade80;
            color: #000;
            border: none;
            padding: 15px;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: 900;
            width: 100%;
            margin-top: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="feed-container" id="feed"></div>

    <!-- Caixa Surpresa Gamificada -->
    <div class="modal-gamification" id="surpriseModal">
        <div class="modal-content">
            <div style="font-size: 4rem; margin-bottom: 10px;">🎁</div>
            <h2>OFERTA RELÂMPAGO!</h2>
            <p style="color: #cbd5e1; font-size: 0.95rem; margin-bottom: 15px;">
                Desbloqueaste um cupão secreto de frete grátis no próximo achadinho. Válido por 10 minutos!
            </p>
            <button class="modal-btn" onclick="fecharModal()">RESGATAR DESCONTO 🛒</button>
        </div>
    </div>

    <script>
        const achadinhos = [
            {
                id: 1,
                titulo: "Mini Projetor Portátil Cinema em Casa 🍿",
                precoAntigo: "R$ 350,00",
                precoNovo: "R$ 189,90",
                loja: "Shopee",
                video: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",
                link: "https://shopee.com.br",
                likes: 1420
            },
            {
                id: 2,
                titulo: "Smartwatch Ultra Série 9 - À Prova de Água ⌚",
                precoAntigo: "R$ 199,90",
                precoNovo: "R$ 89,90",
                loja: "Mercado Livre",
                video: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4",
                link: "https://mercadolivre.com.br",
                likes: 953
            },
            {
                id: 3,
                titulo: "Luminária LED RGB Touch para Escritório Minimalista 💡",
                precoAntigo: "R$ 99,90",
                precoNovo: "R$ 49,90",
                loja: "Shopee",
                video: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4",
                link: "https://shopee.com.br",
                likes: 2104
            },
            {
                id: 4,
                titulo: "Ring Light Profissional com Tripé para Criadores 📸",
                precoAntigo: "R$ 120,00",
                precoNovo: "R$ 59,90",
                loja: "Mercado Livre",
                video: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4",
                link: "https://mercadolivre.com.br",
                likes: 3812
            }
        ];

        const feedEl = document.getElementById('feed');
        let videosCriados = [];

        function carregarFeed() {
            achadinhos.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'video-card';
                card.dataset.id = item.id;
                
                // Duplo clique para curtir
                card.ondblclick = (e) => criarCoracaoFlutuante(e, card);
                
                card.innerHTML = `
                    <video src="${item.video}" loop muted playsinline preload="metadata" id="vid-${index}"></video>
                    
                    <div class="sidebar">
                        <div class="action-icon" id="likeBtn-${item.id}" onclick="curtir(${item.id})">
                            <div class="icon-circle">❤️</div>
                            <span class="icon-text" id="likeCount-${item.id}">${item.likes}</span>
                        </div>
                        <div class="action-icon" onclick="mutarDesmutar(${index})">
                            <div class="icon-circle" id="soundIcon-${index}">🔇</div>
                            <span class="icon-text">Som</span>
                        </div>
                        <div class="action-icon" onclick="partilhar('${item.titulo}')">
                            <div class="icon-circle" style="background: rgba(37, 211, 102, 0.4); border-color: #25d366;">💬</div>
                            <span class="icon-text">Zap</span>
                        </div>
                    </div>

                    <div class="overlay-bottom">
                        <span class="product-badge">🔥 TENDÊNCIA NA ${item.loja}</span>
                        <div class="product-title">${item.titulo}</div>
                        <div class="price-container">
                            <span class="price-new">${item.precoNovo}</span>
                            <span class="price-old">${item.precoAntigo}</span>
                        </div>
                        <a href="${item.link}" target="_blank" class="buy-btn">COMPRAR COM DESCONTO 🛒</a>
                    </div>
                `;
                feedEl.appendChild(card);
                const vidEl = document.getElementById(`vid-${index}`);
                videosCriados.push(vidEl);
            });

            // Intersection Observer: Reproduz APENAS o vídeo que estiver visível na tela
            const observerOptions = {
                root: feedEl,
                threshold: 0.5
            };

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const video = entry.target.querySelector('video');
                    if (entry.isIntersecting) {
                        video.play().catch(err => console.log("Aguardando interação"));
                    } else {
                        video.pause();
                    }
                });
            }, observerOptions);

            document.querySelectorAll('.video-card').forEach(card => {
                observer.observe(card);
            });
        }

        function curtir(id) {
            const btn = document.getElementById(`likeBtn-${id}`);
            const countEl = document.getElementById(`likeCount-${id}`);
            
            if(!btn.classList.contains('liked')) {
                btn.classList.add('liked');
                countEl.innerText = parseInt(countEl.innerText) + 1;
            } else {
                btn.classList.remove('liked');
                countEl.innerText = parseInt(countEl.innerText) - 1;
            }
        }

        function criarCoracaoFlutuante(e, container) {
            const heart = document.createElement('div');
            heart.innerHTML = '❤️';
            heart.className = 'floating-heart';
            heart.style.left = (e.clientX - 30) + 'px';
            heart.style.top = (e.clientY - 30) + 'px';
            container.appendChild(heart);
            
            setTimeout(() => { heart.remove(); }, 1000);
            
            const itemId = container.dataset.id;
            const btn = document.getElementById(`likeBtn-${itemId}`);
            if(!btn.classList.contains('liked')) curtir(itemId);
        }

        function mutarDesmutar(index) {
            const video = videosCriados[index];
            const icone = document.getElementById(`soundIcon-${index}`);
            
            if(video.muted) {
                video.muted = false;
                icone.innerText = "🔊";
            } else {
                video.muted = true;
                icone.innerText = "🔇";
            }
        }

        function partilhar(titulo) {
            const texto = encodeURIComponent(`Olha este achadinho viral: ${titulo}! Vê o vídeo aqui: ` + window.location.href);
            window.open(`https://api.whatsapp.com/send?text=${texto}`, '_blank');
        }

        setTimeout(() => {
            document.getElementById('surpriseModal').classList.add('active');
        }, 12000);

        function fecharModal() {
            document.getElementById('surpriseModal').classList.remove('active');
        }

        carregarFeed();
    </script>
</body>
</html>
