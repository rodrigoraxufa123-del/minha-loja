<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>O Oráculo da Zoeira 🔮</title>
    <style>
        :root {
            --bg-color: #080711;
            --card-bg: #151329;
            --primary: #a855f7;
            --accent: #ec4899;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 30%, #3b0764 0%, var(--bg-color) 70%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: rgba(21, 19, 41, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        h1 {
            font-size: 1.8rem;
            color: #d8b4fe;
            margin-bottom: 8px;
        }

        p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        /* Animação da Bola de Cristal */
        .crystal-ball {
            width: 110px;
            height: 110px;
            background: radial-gradient(circle at 30% 30%, #f3e8ff, #a855f7, #581c87);
            border-radius: 50%;
            margin: 0 auto 25px auto;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.5), inset -10px -10px 20px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.4);
            color: white;
            font-size: 1.05rem;
            margin-bottom: 20px;
            text-align: center;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.3);
        }

        .action-btn {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            border: none;
            padding: 14px 25px;
            font-size: 1.05rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.1s, opacity 0.2s;
            box-shadow: 0 10px 20px rgba(168, 85, 247, 0.3);
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        .result-box {
            background: rgba(0, 0, 0, 0.35);
            border: 1px dashed rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 16px;
            margin-top: 20px;
            font-size: 1.1rem;
            color: #fce7f3;
            line-height: 1.5;
        }

        .whatsapp-btn {
            background-color: #25d366;
            margin-top: 15px;
            box-shadow: 0 10px 20px rgba(37, 211, 102, 0.3);
        }

        .hidden {
            display: none;
        }

        footer {
            margin-top: 30px;
            color: var(--text-muted);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Ecrã Inicial -->
        <div id="screen-home">
            <div class="crystal-ball">🔮</div>
            <h1>O Oráculo da Zoeira</h1>
            <p>Faz a tua pergunta secreta e descobre o que o futuro reserva...</p>
            
            <input type="text" id="userQuestion" placeholder="Ex: Vou ficar rico este ano?">
            <button class="action-btn" onclick="consultarOraculo()">Consultar o Oráculo ✨</button>
        </div>

        <!-- Ecrã de Resposta -->
        <div id="screen-result" class="hidden">
            <div class="crystal-ball" style="animation: none; transform: scale(0.9);">✨</div>
            <h1>Resposta do Oráculo</h1>
            <p id="displayed-question" style="font-style: italic; color: #a855f7;"></p>
            
            <div class="result-box" id="oraculo-answer">A consultar os astros...</div>
            
            <button class="action-btn whatsapp-btn" onclick="partilharWhatsApp()">Partilhar no WhatsApp 💬</button>
            <button class="action-btn" style="background: rgba(255,255,255,0.1); margin-top: 10px;" onclick="voltarInicio()">Fazer Outra Pergunta 🔄</button>
        </div>
    </div>

    <footer>
        Dani Viral Apps • Hospedado no GitHub Pages
    </footer>

    <script>
        const respostasOraculo = [
            "As estrelas dizem que sim... mas só se fores dormir cedo hoje.",
            "Com toda a certeza! Ou talvez não, os astros estão confusos.",
            "Isso é mais improvável do que ganhares na lotaria sem comprar bilhete.",
            "Sim, mas vais arrepender-te em 3 segundos.",
            "O universo mandou avisar para esqueceres isso e ires comer um lanche.",
            "Está escrito nas cartas: vais conseguir, mas com muito drama à mistura.",
            "Pergunte novamente mais tarde, o oráculo está a tirar uma pausa para o café.",
            "Cuidado... Há grandes chances de isso dar muito certo ou muito errado."
        ];

        let perguntaAtual = "";
        let respostaAtual = "";

        function consultarOraculo() {
            const input = document.getElementById('userQuestion').value.trim();
            
            if (!input) {
                alert("Escreve uma pergunta para o oráculo responder!");
                return;
            }

            perguntaAtual = input;
            // Escolhe uma resposta aleatória
            respostaAtual = respostasOraculo[Math.floor(Math.random() * respostasOraculo.length)];

            document.getElementById('displayed-question').innerText = `"${perguntaAtual}"`;
            document.getElementById('oraculo-answer').innerText = respostaAtual;
            
            document.getElementById('screen-home').classList.add('hidden');
            document.getElementById('screen-result').classList.remove('hidden');
        }

        function partilharWhatsApp() {
            const texto = encodeURIComponent(`Fiz uma pergunta ao Oráculo da Zoeira:\n❓ "${perguntaAtual}"\n\n🔮 Resposta: ${respostaAtual}\n\nClica aqui para consultar o teu futuro: ` + window.location.href);
            window.open(`https://api.whatsapp.com/send?text=${texto}`, '_blank');
        }

        function voltarInicio() {
            document.getElementById('userQuestion').value = "";
            document.getElementById('screen-result').classList.add('hidden');
            document.getElementById('screen-home').classList.remove('hidden');
        }
    </script>
</body>
</html>
