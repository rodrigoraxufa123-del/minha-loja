<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dani Live Cams - Câmeras ao Vivo</title>
    <style>
        :root {
            --bg-color: #090d16;
            --card-bg: #111827;
            --primary: #06b6d4;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 2.3rem;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .live-badge {
            background-color: #ef4444;
            color: white;
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 6px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        p { color: var(--text-muted); font-size: 1rem; margin-top: 5px; }

        /* Menu de Seleção de Cidades */
        .city-menu {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 700px;
        }

        .city-btn {
            background-color: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text);
            padding: 10px 18px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .city-btn:hover, .city-btn.active {
            background-color: var(--primary);
            border-color: var(--primary);
            color: #000;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
        }

        /* Container do Vídeo / Câmera */
        .camera-container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
        }

        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .camera-info {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .camera-title {
            font-size: 1.3rem;
            color: #fff;
        }

        .camera-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        footer {
            margin-top: 40px;
            color: var(--text-muted);
            font-size: 0.85rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>
            🌐 Dani Live Cams 
            <span class="live-badge">AO VIVO</span>
        </h1>
        <p>Acompanhe transmissões em tempo real de cidades e pontos do planeta.</p>
    </header>

    <div class="city-menu">
        <button class="city-btn active" onclick="mudarCamera('https://www.youtube.com/embed/AdU82jUZJqY?autoplay=1', 'Nova York - Times Square', 'Movimento ao vivo na famosa praça dos EUA.', this)">🗽 Nova York</button>
        <button class="city-btn" onclick="mudarCamera('https://www.youtube.com/embed/5qap5aO4i9A?autoplay=1', 'Tóquio - Japão (Lo-fi / Vista)', 'Câmera panorâmica urbana de Tóquio.', this)">🗼 Tóquio</button>
        <button class="city-btn" onclick="mudarCamera('https://www.youtube.com/embed/21X5lGlDOfg?autoplay=1', 'Estação Espacial (ISS - Ao Vivo)', 'Visão da Terra em tempo real direto do espaço.', this)">🛰️ Terra do Espaço</button>
        <button class="city-btn" onclick="mudarCamera('https://www.youtube.com/embed/1Ee7rEw4HlI?autoplay=1', 'Miami Beach - Flórida', 'Vista ao vivo da praia e calçadão.', this)">🌴 Miami Beach</button>
    </div>

    <div class="camera-container">
        <div class="video-wrapper">
            <iframe id="cameraFrame" src="https://www.youtube.com/embed/AdU82jUZJqY?autoplay=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
        <div class="camera-info">
            <div>
                <div class="camera-title" id="camTitle">Nova York - Times Square</div>
                <div class="camera-desc" id="camDesc">Movimento ao vivo na famosa praça dos EUA.</div>
            </div>
        </div>
    </div>

    <footer>
        Desenvolvido com GitHub Pages & Termux • 2026
    </footer>

    <script>
        function mudarCamera(urlVideo, titulo, descricao, elementoBotao) {
            // Troca o link do iframe para carregar a nova câmera
            document.getElementById('cameraFrame').src = urlVideo;
            
            // Atualiza os textos informativos
            document.getElementById('camTitle').innerText = titulo;
            document.getElementById('camDesc').innerText = descricao;

            // Gerencia a classe 'active' dos botões do menu
            document.querySelectorAll('.city-btn').forEach(btn => btn.classList.remove('active'));
            elementoBotao.classList.add('active');
        }
    </script>
</body>
</html>
